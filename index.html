<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183329">
  <meta name="description" content="Opulent Oasis Spa near Railway Station, Haridwar. Call 9528929832.">
  <title>Opulent Oasis Spa | Haridwar</title>
  <style>
    :root {
      --green: #183329;
      --green-2: #244638;
      --gold: #c69b59;
      --gold-light: #f4dfa9;
      --cream: #fff9ed;
      --muted: #dfd1b5;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 8% 12%, rgba(255,255,255,.58), transparent 28%),
        radial-gradient(ellipse at 92% 82%, rgba(116,145,112,.25), transparent 32%),
        linear-gradient(135deg, #e8dfce 0%, #cbd4c4 52%, #e7d7bd 100%);
    }
    .page { min-height: 100svh; display: flex; flex-direction: column; }
    header {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand {
      min-width: 0;
      color: #284536;
      font: 700 clamp(.72rem, 2vw, .95rem)/1.25 Arial, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .nav-call {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 17px;
      border-radius: 999px;
      color: #1c281f;
      background: linear-gradient(135deg, #ffedbd, #c9954a);
      text-decoration: none;
      font: 800 .88rem Arial, sans-serif;
      box-shadow: 0 4px 14px rgba(31,39,29,.18);
    }
    main {
      flex: 1;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 22px 20px 58px;
    }
    .hero {
      width: min(100%, 940px);
      min-width: 0;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      text-align: center;
      padding: clamp(34px, 7vw, 72px) clamp(18px, 6vw, 64px);
      border: 1px solid rgba(218,184,119,.88);
      outline: 1px solid rgba(255,255,255,.72);
      outline-offset: 6px;
      border-radius: 5px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(222,190,132,.18), transparent 55%),
        linear-gradient(135deg, rgba(22,49,38,.985), rgba(39,70,53,.985) 52%, rgba(20,45,35,.99));
      box-shadow: 0 20px 55px rgba(32,48,35,.25), inset 0 0 45px rgba(226,195,133,.07);
    }
    /* Quiet botanical details stay at the edges, never behind the copy. */
    .hero::before, .hero::after {
      content: "❧";
      position: absolute;
      z-index: -1;
      top: 7px;
      color: rgba(226,198,145,.28);
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1;
      pointer-events: none;
    }
    .hero::before { left: 9px; transform: rotate(-22deg); }
    .hero::after { right: 9px; transform: scaleX(-1) rotate(-22deg); }
    .eyebrow {
      margin: 0 0 16px;
      color: #e2c58b;
      font: 700 clamp(.62rem, 2vw, .78rem)/1.4 Arial, sans-serif;
      letter-spacing: clamp(.12em, 1.2vw, .30em);
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--gold-light);
      font-weight: 600;
      font-size: clamp(2.15rem, 8vw, 5.8rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      overflow-wrap: break-word;
      text-shadow: 0 2px 0 #76542a, 0 7px 22px rgba(0,0,0,.45);
    }
    .ornament {
      width: min(210px, 55%);
      height: 1px;
      margin: clamp(20px, 4vw, 28px) auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .location {
      margin: 0;
      color: #f7e9cd;
      font: 600 clamp(.95rem, 3.5vw, 1.4rem)/1.5 Arial, sans-serif;
      letter-spacing: .01em;
    }
    .call-label {
      margin: clamp(22px, 5vw, 32px) 0 10px;
      color: var(--muted);
      font: 700 .75rem/1.4 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .phone {
      display: inline-block;
      max-width: 100%;
      color: #ffe8ae;
      text-decoration: none;
      white-space: nowrap;
      font: 800 clamp(1.75rem, 7.4vw, 4.25rem)/1.18 Arial, sans-serif;
      letter-spacing: .005em;
      text-shadow: 0 2px 0 #76542a, 0 5px 18px rgba(0,0,0,.45);
      padding: 3px 0 8px;
      border-bottom: 2px solid var(--gold);
    }
    .phone:focus-visible, .cta:focus-visible, .nav-call:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
    .cta-wrap { margin-top: 27px; }
    .cta {
      width: min(100%, 300px);
      min-height: 58px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      padding: 15px 24px;
      border: 0;
      border-radius: 999px;
      color: #1b261d;
      background: linear-gradient(135deg, #fff0c5, #d5a24e);
      text-decoration: none;
      font: 900 1.05rem Arial, sans-serif;
      letter-spacing: .035em;
      box-shadow: 0 7px 22px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.8);
      -webkit-tap-highlight-color: transparent;
    }
    .cta svg { width: 21px; height: 21px; flex: 0 0 21px; }
    .note {
      margin: 18px 0 0;
      color: #e1d5bd;
      font: .88rem/1.55 Arial, sans-serif;
    }
    footer {
      padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
      text-align: center;
      color: #405844;
      font: .76rem Arial, sans-serif;
    }
    @media (max-width: 600px) {
      header { width: calc(100% - 30px); padding: 15px 0; gap: 8px; }
      .brand { max-width: 62%; font-size: .68rem; letter-spacing: .10em; }
      .nav-call { min-height: 40px; padding: 9px 13px; font-size: .78rem; }
      main { padding: 18px 16px 34px; }
      .hero { padding: 38px 15px 32px; outline-offset: 4px; }
      .hero::before, .hero::after { top: 6px; font-size: 3.2rem; }
      .hero::before { left: 5px; }
      .hero::after { right: 5px; }
      .eyebrow { margin-bottom: 13px; letter-spacing: .13em; }
      h1 { font-size: clamp(2.05rem, 10vw, 3.5rem); line-height: 1.04; }
      .ornament { margin: 20px auto; }
      .location { font-size: clamp(.9rem, 4vw, 1.15rem); }
      .call-label { margin-top: 23px; font-size: .68rem; letter-spacing: .15em; }
      .phone { font-size: clamp(1.72rem, 8.5vw, 2.8rem); letter-spacing: 0; }
      .cta-wrap { margin-top: 24px; }
      .cta { width: 100%; min-height: 56px; max-width: 290px; }
      .note { font-size: .8rem; margin-top: 15px; }
    }
    @media (max-width: 360px) {
      header { width: calc(100% - 24px); }
      .brand { font-size: .62rem; letter-spacing: .075em; }
      .nav-call { padding-inline: 11px; }
      main { padding-inline: 13px; }
      .hero { padding-inline: 12px; }
      .phone { font-size: clamp(1.58rem, 8vw, 1.85rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">Opulent Oasis Spa</div>
      <a class="nav-call" href="tel:+919528929832" aria-label="Call Opulent Oasis Spa">Call Now</a>
    </header>

    <main>
      <section class="hero" aria-labelledby="main-title">
        <p class="eyebrow">Relax · Refresh · Rejuvenate</p>
        <h1 id="main-title">Opulent<br>Oasis Spa</h1>
        <div class="ornament" aria-hidden="true"></div>
        <p class="location">Railway Station, Haridwar</p>
        <p class="call-label">Call for enquiries</p>
        <a class="phone" href="tel:+919528929832" aria-label="Call 9528929832">95289 29832</a>
        <div class="cta-wrap">
          <a class="cta" href="tel:+919528929832">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6.6 3.8 9 3.2l2 4.8-2 1.5a15 15 0 0 0 5.5 5.5l1.5-2 4.8 2-.6 2.4a2 2 0 0 1-2 1.5A15.5 15.5 0 0 1 4.9 6a2 2 0 0 1 1.7-2.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            CALL NOW
          </a>
        </div>
        <p class="note">We’re near Railway Station, Haridwar.</p>
      </section>
    </main>
    <footer>© <span id="year"></span> Opulent Oasis Spa · Haridwar</footer>
  </div>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
